name: Testes de API

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      serverest:
        image: paulogoncalvesbh/serverest:latest
        ports:
          - 3000:3000

    env:
      BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aguardar ServeRest responder
        run: |
          for i in $(seq 1 30); do
            curl -sf "$BASE_URL/usuarios" > /dev/null && echo "ServeRest no ar" && exit 0
            sleep 2
          done
          echo "ServeRest não respondeu" && exit 1

      - name: Rodar testes de API
        run: npm run test:api

      - name: Publicar relatório HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
